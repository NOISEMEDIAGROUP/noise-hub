const av = (initials,size=40,bg='#C73C1E') => `<div class="avatar-circle" style="width:${size}px;height:${size}px;font-size:${size*.33}px;background:${bg}">${initials}</div>`;
const teamAv = (name,size=32) => { const m=team.find(t=>t.name===name); return m ? av(m.initials,size,m.color) : av(name.split(' ').map(x=>x[0]).join(''),size); };
const bdg = (text,cls='b-default') => `<span class="badge ${cls}">${text}</span>`;
const prog = (val,color='var(--red)',h=6,showLabel=false) => `<div style="display:flex;align-items:center;gap:8px;width:100%"><div class="progress-track" style="height:${h}px"><div class="progress-bar" style="width:${Math.min(val,100)}%;background:${color};height:${h}px"></div></div>${showLabel?`<span style="font-size:11px;font-weight:700;color:var(--muted);min-width:36px;font-family:var(--hFont)">${val}%</span>`:''}</div>`;

function statusBdg(s) {
  if(s==='Completed'||s==='Done'||s==='Delivered') return bdg(s,'b-ok');
  if(s==='In Progress') return bdg(s,'b-info');
  if(s==='Pending'||s==='Not Started'||s==='Planned') return bdg(s,'b-default');
  if(s==='Review') return bdg(s,'b-purple');
  if(s==='Revision'||s==='At Risk') return bdg(s,'b-warn');
  if(s==='Overdue'||s==='Behind') return bdg(s,'b-risk');
  if(s==='On Track') return bdg(s,'b-ok');
  return bdg(s,'b-default');
}
function priBdg(p) {
  if(p==='Urgent') return bdg(p,'b-risk');
  if(p==='High') return bdg(p,'b-warn');
  if(p==='Medium') return bdg(p,'b-info');
  return bdg(p,'b-default');
}
function goalColor(s){ return s==='On Track'||s==='Completed'?'var(--ok)':s==='At Risk'?'var(--warn)':'var(--risk)'; }
function heatColor(v){ return v>=4.5?'#3D8B4F':v>=4.0?'#5CB85C':v>=3.5?'#8FD48F':v>=3.0?'#D4A843':v>=2.5?'#D47B50':'#C73C1E'; }
function heatText(v){ return v>=3.5&&v<4.0?'var(--charcoal)':'var(--white)'; }
function labelColor(l) {
  const m = {'Urgent':'#C73C1E','Content':'#1B1B1B','Research':'#5A9ECF','Motion':'#9070C0','Resize':'#D4A843',
    'Video':'#5A9ECF','Design':'#9070C0','Revision':'#D4A843','B2B':'#5CB85C','1-to-1':'#C73C1E',
    'Process':'#5A9ECF','Training':'#9070C0','Automation':'#D4A843','High Impact':'#C73C1E',
    'Creative':'#9070C0','Adopted':'#5CB85C','Review':'#C73C1E'};
  return m[l]||'#8C8C8C';
}
function statusPill(s) {
  const colors = {'In Progress':'#5A9ECF','Not Started':'#8C8C8C','Review':'#9070C0','Revision':'#D4A843',
    'Planned':'#AAAAAA','Done':'#5CB85C','Delivered':'#5CB85C','Urgent':'#C73C1E'};
  const c = colors[s]||'#8C8C8C';
  return `<span class="status-pill" style="background:${c}15;color:${c};border:1px solid ${c}30">${s}</span>`;
}

  <div class="kanban-wrap">

      <div class="kanban-col" ondragover="event.preventDefault()" ondrop="dropCard(event,${ci})">
        <div class="kanban-col-header">
          <span class="kanban-col-title">${col.title}</span>
          <span class="kanban-count">${col.cards.length}</span>
        </div>
        ${col.cards.map(card => `
          <div class="kanban-card" draggable="true" ondragstart="dragStart(event,'${currentBoard}',${ci},${card.id})" ondragend="dragEnd(event)">
            <div class="kanban-labels">${card.labels.map(l=>`<span class="kanban-label" style="background:${labelColor(l)}15;color:${labelColor(l)}">${l}</span>`).join('')}</div>
            <div class="kanban-card-title">${card.title}</div>

              <div class="kanban-card-meta">${card.due}</div>
              ${teamAv(card.assignee,22)}
            </div>
          </div>`).join('')}
        <button class="add-card-btn" onclick="openNewCardModal(${ci})">+ Add card</button>
      </div>`).join('')}
  </div>`;
}

function dragStart(e,board,colIdx,cardId) { dragCard={board,colIdx,cardId}; e.target.classList.add('dragging'); }
function dragEnd(e) { e.target.classList.remove('dragging'); }
function dropCard(e,targetColIdx) {
  e.preventDefault();
  if (!dragCard || dragCard.board !== currentBoard) return;
  const board = kanbanBoards[dragCard.board];
  const srcCol = board.columns[dragCard.colIdx];
  const cardIdx = srcCol.cards.findIndex(c=>c.id===dragCard.cardId);
  if (cardIdx===-1) return;
  const [card] = srcCol.cards.splice(cardIdx,1);
  board.columns[targetColIdx].cards.push(card);
  dragCard = null;
  renderPage();
}

// ═══════════════════════════════════════════════════════════
// 9-BOX GRID
// ═══════════════════════════════════════════════════════════
function renderNinebox() {
  const labels=[["Enigma","Growth Talent","Future Star"],["Underperformer","Core Player","High Performer"],["Risk","Solid Performer","Consistent Star"]];
  const bgs=[["var(--warn-light-bg)","var(--info-light-bg)","var(--purple-light-bg)"],["var(--risk-light-bg)","#F0F0E8","var(--ok-light-bg)"],["var(--risk-light-bg)","var(--warn-light-bg)","var(--ok-light-bg)"]];
  const boxes = {};
  team.forEach(t => {
    const pi = t.rating>=4.0?2:t.rating>=3.5?1:0;
    const poi = t.potential==='High'?2:t.potential==='Medium'?1:0;
    const k = poi+'-'+pi;
    if(!boxes[k]) boxes[k]=[];
    boxes[k].push(t);
  });
  let grid = '';
  [2,1,0].forEach(potIdx => {
    [0,1,2].forEach(perfIdx => {
      const k = potIdx+'-'+perfIdx;
      const es = boxes[k]||[];
      const r = 2-potIdx;
      grid += `<div class="ninebox-cell" style="background:${bgs[r][perfIdx]}"><div class="cell-label">${labels[r][perfIdx]}</div><div style="display:flex;flex-wrap:wrap;gap:4px">${es.map(t=>`<div title="${t.name}\n${t.role}\nRating: ${t.rating}">${av(t.initials,30,t.color)}</div>`).join('')}${es.length===0?'<div style="font-size:10px;color:var(--muted);font-style:italic">—</div>':''}</div></div>`;
    });
  });
  return `
  <div class="mb-28"><h1 class="page-title">9-Box Grid<span class="nm-dot"></span></h1><p class="page-sub">Map team by performance and potential</p></div>
  <div class="card">
    <div class="flex">
      <div style="display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--hFont);font-weight:700;font-size:11px;color:var(--muted);padding-right:12px;letter-spacing:2px;text-transform:uppercase">← Potential →</div>
      <div style="flex:1">
        <div style="display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:4px">${grid}</div>
        <div class="text-center mt-12" style="font-family:var(--hFont);font-weight:700;font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase">← Performance →</div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);margin-top:4px">${['Low','Medium','High'].map(l=>`<div class="text-center" style="font-size:10px;color:var(--muted);font-family:var(--hFont);text-transform:uppercase;letter-spacing:1px">${l}</div>`).join('')}</div>
      </div>
      <div style="display:flex;flex-direction:column;justify-content:space-around;padding-left:8px">${['High','Medium','Low'].map(l=>`<div style="font-size:9px;color:var(--muted);writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--hFont);text-transform:uppercase;letter-spacing:1px">${l}</div>`).join('')}</div>
    </div>
  </div>`;
}

        <div style="padding:12px;background:#F5F5ED;border-radius:6px;text-align:center"><div style="font-size:24px;font-weight:800;color:var(--ok);font-family:var(--hFont)">${Math.round(sel.goalsDone/sel.goalsTotal*100)}%</div><div style="font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px">Goals</div></div>
      </div>
      ${prog(Math.round(sel.goalsDone/sel.goalsTotal*100),'var(--ok)',6,true)}
      <div class="mt-12">
        <div class="flex justify-between" style="padding:8px 0;border-bottom:1px solid #EEEEE8"><span style="font-size:12px;color:var(--muted)">Potential</span>${bdg(sel.potential,sel.potential==='High'?'b-ok':'b-warn')}</div>
        <div class="flex justify-between" style="padding:8px 0;border-bottom:1px solid #EEEEE8"><span style="font-size:12px;color:var(--muted)">Review</span>${statusBdg(sel.reviewStatus)}</div>
        <div class="flex justify-between" style="padding:8px 0"><span style="font-size:12px;color:var(--muted)">Email</span><span style="font-size:12px;color:var(--red)">${sel.email}</span></div>
      </div>
      <div class="flex gap-8 mt-16">
        <button class="btn-primary" style="flex:1;font-size:11px" onclick="navigate('feedback')">Feedback</button>
        <button class="btn-secondary" style="flex:1" onclick="navigate('checkins')">Check-ins</button>
      </div>
    </div>` : ''}
  </div>`;
}

// ═══════════════════════════════════════════════════════════
// MODALS
// ═══════════════════════════════════════════════════════════
function openModal(html) { document.getElementById('modalContent').innerHTML=html; document.getElementById('modalOverlay').classList.remove('hidden'); }
function closeModal() { document.getElementById('modalOverlay').classList.add('hidden'); }

function openNewCardModal(colIdx) {
  const board = kanbanBoards[currentBoard];
  openModal(`
    <h2>Add Card<span class="nm-dot"></span></h2>
    <label>Title</label><input id="ncTitle" placeholder="Card title...">
    <label>Assignee</label><select id="ncAssignee">${team.map(t=>`<option>${t.name}</option>`).join('')}</select>
    <label>Due Date</label><input id="ncDue" type="date">
    <label>Column</label><select id="ncCol">${board.columns.map((c,i)=>`<option value="${i}" ${i===colIdx?'selected':''}>${c.title}</option>`).join('')}</select>
    <div class="flex gap-8 mt-8"><button class="btn-primary" onclick="addCard()">Add</button><button class="btn-secondary" onclick="closeModal()">Cancel</button></div>
  `);
}
function addCard() {
  const title = document.getElementById('ncTitle').value;
  if (!title) return;
  const col = +document.getElementById('ncCol').value;
  kanbanBoards[currentBoard].columns[col].cards.push({ id:Date.now(), title, labels:[], assignee:document.getElementById('ncAssignee').value, due:document.getElementById('ncDue').value||'TBD' });
  closeModal(); renderPage();
}

function openNewTaskModal() {
  openModal(`
    <h2>New Task<span class="nm-dot"></span></h2>
    <label>Task Name</label><input id="ntTask" placeholder="Task name...">
    <label>Owner</label><select id="ntOwner">${team.map(t=>`<option>${t.name}</option>`).join('')}</select>
    <label>Priority</label><select id="ntPri"><option>High</option><option>Medium</option><option>Low</option><option>Urgent</option></select>
    <label>Due Date</label><input id="ntDue" type="date">
    <label>Type</label><input id="ntType" placeholder="Campaign, Video, Design...">
    <div class="flex gap-8 mt-8"><button class="btn-primary" onclick="addTask()">Add</button><button class="btn-secondary" onclick="closeModal()">Cancel</button></div>
  `);
}
function addTask() {
  const task = document.getElementById('ntTask').value;
  if (!task) return;
  workItems.push({ id:Date.now(), task, owner:document.getElementById('ntOwner').value, status:'Not Started', priority:document.getElementById('ntPri').value, due:document.getElementById('ntDue').value||'TBD', type:document.getElementById('ntType').value||'General', progress:0 });
  closeModal(); renderPage();
}

function openCheckinModal() {
  openModal(`
    <h2>Schedule Check-in<span class="nm-dot"></span></h2>
    <label>Manager</label><select id="ciMgr">${team.map(t=>`<option>${t.name}</option>`).join('')}</select>
    <label>Team Member</label><select id="ciEmp">${team.map(t=>`<option>${t.name}</option>`).join('')}</select>
    <label>Type</label><select id="ciType"><option>1-to-1</option><option>Wellbeing</option><option>Career Dev</option></select>
    <label>Date</label><input id="ciDate" type="date">
    <label>Notes</label><textarea id="ciNotes" placeholder="Discussion topics..."></textarea>
    <div class="flex gap-8 mt-8"><button class="btn-primary" onclick="addCheckin()">Schedule</button><button class="btn-secondary" onclick="closeModal()">Cancel</button></div>
  `);
}
function addCheckin() {
  checkins.unshift({ id:Date.now(), manager:document.getElementById('ciMgr').value, employee:document.getElementById('ciEmp').value, date:document.getElementById('ciDate').value||'2026-03-16', type:document.getElementById('ciType').value, mood:'😊', notes:document.getElementById('ciNotes').value||'Scheduled check-in', actions:[] });
  closeModal(); renderPage();
}

renderQuickLogins();
document.getElementById('loginPass').addEventListener('keydown', e => { if(e.key==='Enter') attemptLogin(); });
